name: Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Build and deploy Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify VPS and Backend configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/ecommerce/backend/app
          test -f Dockerfile
          test -f .dockerignore
          test -f /opt/ecommerce/env/backend.env
          docker network inspect ecommerce-network >/dev/null
          docker ps --filter name='^krishna-backend$' --format '{{.Names}}' | grep -qx krishna-backend
          docker ps --filter name='^krishna-postgres$' --format '{{.Names}}' | grep -qx krishna-postgres
          echo "Backend pre-deployment checks passed."
          REMOTE

      - name: Deploy latest main commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -eu

          APP=/opt/ecommerce/backend/app
          ENV_FILE=/opt/ecommerce/env/backend.env
          cd "$APP"

          # Refresh Git's index before checking for tracked changes.
          git update-index --refresh

          if [ -n "$(git diff --name-only)" ] || [ -n "$(git diff --cached --name-only)" ]; then
            echo "ERROR: Tracked local changes detected. No deployment performed."
            git status --short
            exit 1
          fi

          # Preserve the currently running backend image for rollback.
          OLD_IMAGE_ID=$(docker inspect krishna-backend --format '{{.Image}}')
          OLD_IMAGE_TAG="krishna-textiles-backend:rollback-$(date +%Y%m%d%H%M%S)"
          docker image tag "$OLD_IMAGE_ID" "$OLD_IMAGE_TAG"

          # Update tracked repository files.
          git fetch origin main
          git reset --hard origin/main

          # Build the new backend image.
          NEW_TAG="krishna-textiles-backend:deploy-$(git rev-parse --short HEAD)-$(date +%Y%m%d%H%M%S)"
          docker build -t "$NEW_TAG" .

          # Load the existing production environment file.
          # Do not print or expose its secrets.
          test -f "$ENV_FILE"

          # Replace the backend container while preserving PostgreSQL.
          docker rm -f krishna-backend

          if docker run -d \
            --name krishna-backend \
            --restart unless-stopped \
            --network ecommerce-network \
            -p 127.0.0.1:4000:4000 \
            --env-file "$ENV_FILE" \
            "$NEW_TAG"; then

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4000/api/docs -o /dev/null; then
                echo "Backend deployment healthy: $NEW_TAG"
                exit 0
              fi
              sleep 2
            done
          fi

          # Roll back if the new backend fails its health check.
          echo "ERROR: Backend deployment failed. Rolling back."
          docker rm -f krishna-backend >/dev/null 2>&1 || true

          docker run -d \
            --name krishna-backend \
            --restart unless-stopped \
            --network ecommerce-network \
            -p 127.0.0.1:4000:4000 \
            --env-file "$ENV_FILE" \
            "$OLD_IMAGE_TAG"

          exit 1
          REMOTE
